# D-33: CI on every pull request and push to master. No secrets: the engine runs with
# LLM_PROVIDER=null and nothing calls Anthropic, Clerk or Neon. Sprint 003 adds a Postgres
# service container (postgres:18, the Neon major, D-37) for the marketplace tests.
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (pytest, ruff, mypy, schema and snapshot checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    env:
      LLM_PROVIDER: "null"
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/venture_route_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venture_route_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venture_route_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      # Acceptance: `alembic upgrade head` runs clean on an empty database (spec #35, D-17).
      - run: uv run alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run pytest -q -p no:cacheprovider
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python scripts/export_schema.py --check
      - run: uv run python scripts/export_offline_snapshot.py --check

  web:
    name: web (typecheck, lint, test, Playwright e2e)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: "null"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      # Playwright runs against vite preview with the engine on LLM_PROVIDER=null (PROMPTS §Sprint 002).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: services/engine
      - run: pnpm -F web exec playwright install --with-deps chromium
      - run: pnpm -F web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
